# Minimal, permissive CRD for the cert-manager.io/v1 Certificate resource that the CAP
# Operator watches and creates when CERT_MANAGER=cert-manager.io. Uses
# x-kubernetes-preserve-unknown-fields to accept the full cert-manager spec without
# vendoring the upstream CRDs, keeping the integration suite hermetic.
#
# If stricter schema validation is desired, replace this with the official cert-manager
# CRD for the version pinned in go.mod (github.com/cert-manager/cert-manager).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  scope: Namespaced
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
    shortNames:
      - cert
      - certs
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
