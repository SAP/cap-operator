name: Vulnerability Scan
on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 7 * * *"

  workflow_dispatch:
    inputs:
      skip-govulncheck:
        description: "Skip govulncheck"
        required: false
        default: false
        type: boolean
      version:
        description: "Image tag to scan"
        required: false
        default: "latest"
        type: string

permissions:
  packages: read
  security-events: write

jobs:
  go-vuln:
    name: govulncheck
    runs-on: ubuntu-26.04
    if: ${{ inputs.skip-govulncheck }} != true
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Vulnerability Check
        uses: golang/govulncheck-action@v1
        with:
          output-format: sarif
          output-file: vuln-go.sarif

      - name: Upload govulncheck results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vuln-go.sarif

  scan:
    name: Scan container image
    strategy:
      matrix:
        workload: ["controller", "server", "web-hooks"]
    runs-on: ubuntu-26.04
    steps:
      - name: Run trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sap/cap-operator/${{ matrix.workload }}:${{ inputs.version || 'latest' }}
          scanners: "vuln"
          version: "v0.76.2"
          format: "sarif"
          output: "vuln-${{ matrix.workload }}.sarif"

      - name: Upload trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "vuln-${{ matrix.workload }}.sarif"

      - name: Run grype scanner
        uses: anchore/scan-action@v7
        with:
          fail-build: false
          grype-version: v0.121.2
          image: ghcr.io/sap/cap-operator/${{ matrix.workload }}:${{ inputs.version || 'latest' }}
          output-file: "vuln-grype-${{ matrix.workload }}.sarif"

      - name: Upload grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "vuln-grype-${{ matrix.workload }}.sarif"
